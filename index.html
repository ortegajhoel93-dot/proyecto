<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>TOxKO1.1</title>
</head>
<body>
      
    <div class="mis-productos">
          <h1 class="titulo">Productos</h1>
    </div>

    <div class="row">
        <!-- Producto 1 -->
        <div class="product-box">
            <a href="#" class="product-link">
                <img src="img/BOOMM.jpeg" alt="Modelo BOOM">
            </a>
            <div class="product-info">
                 <h3>Modelo BOOOMM</h3>
                 <strong class="price"><small class="pequeño" > $35.99</small> <br> $20.00</strong>
                 
                 <!-- Selección de Talla -->
                 <div class="options-group">
                     <span class="option-label">Talla:</span>
                     <div class="sizes">
                         <button type="button" class="size-btn">S</button>
                         <button type="button" class="size-btn active">M</button>
                         <button type="button" class="size-btn">L</button>
                         <button type="button" class="size-btn">XL</button>
                     </div>
                 </div>

                 <!-- Selección de Color -->
                 <div class="options-group">
                     <span class="option-label">Color:</span>
                     <div class="colors">
                         <button type="button" class="color-btn black active" title="Negro"></button>
                         <button type="button" class="color-btn white" title="Blanco"></button>
                         <button type="button" class="color-btn red" title="Rojo"></button>
                     </div>
                 </div>
            </div>
        </div>

        <!-- Producto 2 -->

                <img src="img/Bang.jpeg" alt="Modelo Bang">

                    </div>
                </div>

            </div>
        </div>

</html>
